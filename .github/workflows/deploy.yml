name: Canlı Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Sunucuda git pull
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.SERVER_PATH }}
            git fetch origin
            git checkout develop
            git pull origin develop
            cd phx && composer install --no-dev --quiet 2>/dev/null || true
            echo "Deploy tamamlandi: $(git log -1 --oneline)"
